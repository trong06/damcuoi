<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        /* Xóa mọi khoảng trắng và thanh cuộn của trình duyệt */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: black; /* Nền đen tràn viền */
        }
        
        /* Ép video chiếm toàn bộ không gian màn hình */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://drive.google.com/file/d/1jis2BRrIf5Fcv37TOfbKjDX6w3c4VKKT/preview" 
        allow="autoplay; fullscreen">
    </iframe>

</body>
</html>
