<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Ép video tự động căn chỉnh vừa màn hình, không bị méo tỉ lệ */
        video {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            outline: none;
        }
    </style>
</head>
<body>

    <video controls playsinline>
        <source src="https://drive.google.com/uc?export=download&id=1jis2BRrIf5Fcv37TOfbKjDX6w3c4VKKT" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

</body>
</html>
